<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Central Control [v2.5]</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>

<body>

    <div class="taskbar-top">
        <div class="header-content">
            <div class="header-left">
                <span id="auth-status">Login</span>
            </div>
            <div id="clock" class="system-tray">00:00:00</div>
        </div>
    </div>

    <div class="desktop">

        <div id="welcome-window" class="window">
            <div class="window-title">
                <span>ESP32 Device Control [v2.0]</span>
            </div>

            <div class="window-body">
                <div class="welcome-message" style="text-align: center">
                    <p>Bun venit în Centrul de Control</p>
                </div>

                <div class="buttons-container">
                    <button class="control-button" id="main-control-btn" onclick="openControl()">🕹️ Control Panel</button>
                    <button class="control-button" onclick="openWindow('login-window')">🔑 Autentificare</button>
                </div>
            </div>

            <div class="status-bar">
                <div class="status-field" id="esp-status">
                    Status ESP: <span id="status-text">DECONECTAT</span>
                    <div id="connection-led" class="indicator-red"></div>
                </div>
            </div>
        </div>

        <div id="login-window" class="window" style="display: none;">
            <div class="window-title">
                <span>Autentificare</span>
                <button class="win-btn" onclick="closeWindow('login-window')">X</button>
            </div>

            <div class="window-body">
                <div class="input-row">
                    <span class="input-icon">👤</span>
                    <input type="text" id="auth-username" placeholder="Nume Utilizator" class="win-input" style="margin-bottom: 16px">
                </div>

                <div class="input-row">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="auth-pass" placeholder="Parolă" class="win-input" style="margin-bottom: 16px">
                </div>

                <div class="buttons-container">
                    <button id="login-btn" onclick="handleAuth('login')" class="control-button small">Login</button>
                    <button id="reg-account-btn" onclick="handleAuth('register')" class="control-button small">Înregistreză</button>
                    <button id="del-account-btn" onclick="handleAuth('delete')" class="control-button small" style="margin-top: 48px; background-color: #770000;">Șterge cont</button>
                </div>
            </div>
        </div>

        <div id="control-window" class="window" style="display: none; height: auto; width: 850px;">
            <div class="window-title">
                <span>Panou Control Actuatoare & Monitorizare DHT11</span>
                <button class="win-btn" onclick="closeWindow('control-window')">X</button>
            </div>

            <div class="window-body">
                <div class="camera-layout">
                    
                    <div class="lcd-zone">
                        <div class="lcd-header">✍ Text Ecran LCD 2004</div>
                        <input type="text" id="lcd-line-1" placeholder="Linia 1 (max 20 caractere)" class="win-input lcd-input" maxlength="20">
                        <input type="text" id="lcd-line-2" placeholder="Linia 2 (max 20 caractere)" class="win-input lcd-input" maxlength="20">
                        <input type="text" id="lcd-line-3" placeholder="Linia 3 (max 20 caractere)" class="win-input lcd-input" maxlength="20">
                        <div style="display: flex; gap: 8px; width: 100%; margin-top: 10px;">
                            <button class="control-button small" style="flex: 1; width: auto;" onclick="updateLcdText()">⏏️ Încarcă</button>
                            <button class="control-button small" style="flex: 1; width: auto;" onclick="clearLcdText()">🧹 Șterge</button>
                        </div>
                    </div>

                    <div class="controls-zone">
                        <div class="telemetry-display">
                            Temp: <span id="val-temp">--</span>°C | Umid: <span id="val-hum">--</span>%
                        </div>
                        <hr style="width:100%; border:1px inset var(--win-white);">
                        
                        <label class="control-label">Poziție Servo: <span id="angle-val">90</span>⁰</label>
                        <input type="range" min="0" max="180" value="90" class="angle-slider" onchange="sendServoCommand(this.value)">

                        <label class="control-label" style="margin-top: 10px;">Delay Servo (0..100 ms):</label>
                        <div style="display: flex; gap: 8px; width: 100%; margin-top: 4px;">
                            <input type="number" id="servoDelayInput" class="win-input" style="flex: 1; margin-bottom: 0px !important; padding: 4px;" min="0" max="100" value="15">
                            <button class="control-button small" style="width: auto; padding: 0 12px; margin-top: 0;" onclick="sendServoDelayFromInput()">⚙️ Setează</button>
                        </div>

                        <div class="toggle" style="margin-top: 15px;">
                            <input type="checkbox" id="fanToggle" onchange="sendFanCommand(this.checked)">
                            <label for="fanToggle" id="fanLabel">Ⓜ️ Pornire Ventilator</label>
                        </div>

                        <div style="margin-top: 10px;">
                            <label class="control-label">Viteză Ventilator: <span id="fan-speed-val">50</span>%</label>
                            <input type="range" min="0" max="100" value="50" class="angle-slider" id="fanSpeedSlider" oninput="sendFanSpeedCommand(this.value)">
                        </div>
                    </div>

                </div>

                <div class="chart-container-title" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span>📈 Istoric Date Senzor</span>
                    <div class="toggle" style="margin-top: 0;">
                        <input type="checkbox" id="saveToggle">
                        <label for="saveToggle">💾 Salvare istoric (local)</label>
                    </div>
                </div>
                <div class="chart-zone">
                    <canvas id="live-chart" width="790" height="160"></canvas>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
